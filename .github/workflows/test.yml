name: Tests

on:
  workflow_call: {}
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
  
jobs:
  test:
    name: ${{ matrix.platform }} Tests
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS, tvOS, watchOS, visionOS]

    steps:
    - uses: actions/checkout@v4
      timeout-minutes: 2

    - name: Run Unit Tests
      uses: mxcl/xcodebuild@v3
      timeout-minutes: 5
      with:
        action: test
        platform: ${{ matrix.platform }}